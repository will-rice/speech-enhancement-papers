<svg id="A3.pic6.p2.pic1" class="ltx_picture" color="#000000" height="162.27" overflow="visible" version="1.1" viewbox="0 0 625.59 162.27" width="625.59"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,162.27) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E6E6E6;" fill="#E6E6E6" fill-opacity="1.0"><path style="stroke:none" d="M 0 0.69 L 0 161.57 C 0 161.96 0.31 162.27 0.69 162.27 L 624.9 162.27 C 625.28 162.27 625.59 161.96 625.59 161.57 L 625.59 0.69 C 625.59 0.31 625.28 0 624.9 0 L 0.69 0 C 0.31 0 0 0.31 0 0.69 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 161.57 L 624.9 161.57 L 624.9 0.69 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 11.26)"><foreignobject style="--ltx-fo-width:43.97em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="608.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.pic6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.97em;">
<span id="A3.pic6.p2.pic1.1.1" class="ltx_p">To solve this problem, we need to calculate the area of a circle with radius 6 cm and subtract it from the total surface area.</span>
<span id="A3.pic6.p2.pic1.1.2" class="ltx_p">1. Calculate the circumference:
- Formula: <math id="A3.pic6.p2.pic1.m1" class="ltx_Math" alttext="C=2\pi r" display="inline" intent=":literal"><semantics><mrow><mi>C</mi><mo>=</mo><mrow><mn>2</mn><mo lspace="0em" rspace="0em">​</mo><mi>π</mi><mo lspace="0em" rspace="0em">​</mo><mi>r</mi></mrow></mrow><annotation encoding="application/x-tex">C=2\pi r</annotation></semantics></math>
- Given radius (<math id="A3.pic6.p2.pic1.m2" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi>r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>) = 6 cm
- Circumference (<math id="A3.pic6.p2.pic1.m3" class="ltx_Math" alttext="C" display="inline" intent=":literal"><semantics><mi>C</mi><annotation encoding="application/x-tex">C</annotation></semantics></math>) = <math id="A3.pic6.p2.pic1.m4" class="ltx_Math" alttext="2\times\pi\times 6=37.68" display="inline" intent=":literal"><semantics><mrow><mrow><mn>2</mn><mo lspace="0.222em" rspace="0.222em">×</mo><mi>π</mi><mo lspace="0.222em" rspace="0.222em">×</mo><mn>6</mn></mrow><mo>=</mo><mn>37.68</mn></mrow><annotation encoding="application/x-tex">2\times\pi\times 6=37.68</annotation></semantics></math> cm</span>
<span id="A3.pic6.p2.pic1.1.3" class="ltx_p">2. Calculate the area of the circle:
- Formula: <math id="A3.pic6.p2.pic1.m5" class="ltx_Math" alttext="A=\pi r^{2}" display="inline" intent=":literal"><semantics><mrow><mi>A</mi><mo>=</mo><mrow><mi>π</mi><mo lspace="0em" rspace="0em">​</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></mrow><annotation encoding="application/x-tex">A=\pi r^{2}</annotation></semantics></math>
- Area (<math id="A3.pic6.p2.pic1.m6" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi>A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math>) = <math id="A3.pic6.p2.pic1.m7" class="ltx_Math" alttext="\pi\times 6^{2}=113.04" display="inline" intent=":literal"><semantics><mrow><mrow><mi>π</mi><mo lspace="0.222em" rspace="0.222em">×</mo><msup><mn>6</mn><mn>2</mn></msup></mrow><mo>=</mo><mn>113.04</mn></mrow><annotation encoding="application/x-tex">\pi\times 6^{2}=113.04</annotation></semantics></math> cm<sup id="A3.pic6.p2.pic1.1.3.1" class="ltx_sup">2</sup></span>
<span id="A3.pic6.p2.pic1.1.4" class="ltx_p">3. Subtract the area of the circle from the total surface area (25 square decimeters):
- Convert 25 dm<sup id="A3.pic6.p2.pic1.1.4.1" class="ltx_sup">2</sup> to cm<sup id="A3.pic6.p2.pic1.1.4.2" class="ltx_sup">2</sup>: <math id="A3.pic6.p2.pic1.m8" class="ltx_Math" alttext="25\times 100=2500" display="inline" intent=":literal"><semantics><mrow><mrow><mn>25</mn><mo lspace="0.222em" rspace="0.222em">×</mo><mn>100</mn></mrow><mo>=</mo><mn>2500</mn></mrow><annotation encoding="application/x-tex">25\times 100=2500</annotation></semantics></math> cm<sup id="A3.pic6.p2.pic1.1.4.3" class="ltx_sup">2</sup>
- Remaining area after removing the circular part: <math id="A3.pic6.p2.pic1.m9" class="ltx_Math" alttext="2500-113.04=2386.96" display="inline" intent=":literal"><semantics><mrow><mrow><mn>2500</mn><mo>−</mo><mn>113.04</mn></mrow><mo>=</mo><mn>2386.96</mn></mrow><annotation encoding="application/x-tex">2500-113.04=2386.96</annotation></semantics></math> cm<sup id="A3.pic6.p2.pic1.1.4.4" class="ltx_sup">2</sup></span>
<span id="A3.pic6.p2.pic1.1.5" class="ltx_p">Therefore, the remaining area is approximately 2386.96 cm<sup id="A3.pic6.p2.pic1.1.5.1" class="ltx_sup">2</sup>.</span>
</span></span></span></foreignobject></g></g></svg>