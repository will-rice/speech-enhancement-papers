<span id="A3.pic10.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.97em;">
<span id="A3.pic10.p1.pic1.1.1" class="ltx_p">A virus replicates by injecting its genetic material into a host cell, hijacking the cell’s machinery to produce more viral particles, which are then released to infect other cells. Viruses can spread between hosts through direct contact, respiratory droplets, contaminated surfaces, or vectors like insects.</span>
