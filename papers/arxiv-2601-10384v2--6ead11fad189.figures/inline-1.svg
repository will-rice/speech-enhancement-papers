</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.78 13.78)"><foreignobject style="--ltx-fo-width:45.21em;--ltx-fo-height:42.63em;--ltx-fo-depth:0em;font-size:10pt;" height="589.82" overflow="visible" transform="matrix(1 0 0 -1 0 589.82)" width="625.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A0.F4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.21em;">
<span id="A0.F4.pic1.p5" class="ltx_para">
<span id="A0.F4.pic1.p5.1" class="ltx_p"><span id="A0.F4.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System Instructions]<span id="A0.F4.pic1.p5.1.1.1" class="ltx_text"></span></span></span>
<span id="A0.F4.pic1.p5.2" class="ltx_p"><span id="A0.F4.pic1.p5.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task<span id="A0.F4.pic1.p5.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a strict evaluator. Rate the model’s answer based on its alignment with the reference answer, focusing on accuracy and relevance to the reference. Be critical on details. If the model response is something like “cannot decide” / “unable to answer”, rate as 0.</span></span></span>
<span id="A0.F4.pic1.p5.3" class="ltx_p"><span id="A0.F4.pic1.p5.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scoring Rubric<span id="A0.F4.pic1.p5.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Score 0: Refusal or non-committal (e.g., “cannot decide”), or no concrete result. 
<br class="ltx_break">Score 0: Completely misaligned; incorrect or irrelevant compared to the reference. 
<br class="ltx_break">Score 1: Minimal alignment; largely misunderstands or provides irrelevant details. 
<br class="ltx_break">Score 2: On-topic but diverges significantly from the reference in accuracy or relevance. 
<br class="ltx_break">Score 3: Generally aligned but missing key details or containing minor inaccuracies. 
<br class="ltx_break">Score 4: Mostly accurate and relevant; closely follows the reference but could be clearer or more complete. 
<br class="ltx_break">Score 5: Highly accurate and detailed; matches the reference answer essentially perfectly.</span></span></span>
<span id="A0.F4.pic1.p5.4" class="ltx_p"><span id="A0.F4.pic1.p5.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format<span id="A0.F4.pic1.p5.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Explanation: (Briefly compare the reference vs. the model answer and justify the score.) 
<br class="ltx_break">Rating: (An integer in {0,1,2,3,4,5})</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A0.F4.pic1.p5.5" class="ltx_p"><span id="A0.F4.pic1.p5.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[Input Data]<span id="A0.F4.pic1.p5.5.1.1" class="ltx_text"></span></span></span>
<span id="A0.F4.pic1.p5.6" class="ltx_p"><span id="A0.F4.pic1.p5.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="A0.F4.pic1.p5.6.1.1" class="ltx_text"></span></span></span>
</span>
